<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantOS v8.9.1 | Strategy Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #06090f;
            --card-bg: #0d1117;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }
        body { background-color: var(--bg-dark); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .navbar { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 0.5rem 1.5rem; }
        .nav-link { color: var(--text-secondary); font-weight: 500; }
        .nav-link.active { color: var(--text-primary); border-bottom: 2px solid var(--accent-blue); }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; }
        .card-header { background-color: #161b22; border-bottom: 1px solid var(--border-color); color: var(--text-primary); font-weight: 600; font-size: 0.9rem; }
        .form-label { color: var(--text-primary); font-weight: 500; font-size: 0.85rem; }
        .table {
            color: var(--text-primary);
            --bs-table-bg: var(--card-bg);
            --bs-table-striped-bg: #161b22;
            --bs-table-striped-color: var(--text-primary);
            --bs-table-hover-bg: #161b22;
            --bs-table-hover-color: var(--text-primary);
            --bs-table-border-color: var(--border-color);
        }
        .table thead th { border-bottom: 2px solid var(--border-color); color: var(--text-secondary); font-weight: 600; font-size: 0.75rem; }
        .positive { color: var(--accent-green) !important; }
        .negative { color: var(--accent-red) !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-activity me-2"></i>QUANT<span class="text-info">OS</span>
        </a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/settings"><i class="bi bi-gear me-1"></i> Engine Room</a></li>
            <li class="nav-item"><a class="nav-link active" href="/backtester"><i class="bi bi-flask me-1"></i> Strategy Lab</a></li>
            <li class="nav-item"><a class="nav-link" href="/analytics"><i class="bi bi-graph-up me-1"></i> Analytics</a></li>
        </ul>
    </div>
</nav>

<div class="container-fluid py-4">
    <div class="row g-3">
        <!-- Simulation Params -->
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-header">Backtest Configuration</div>
                <div class="card-body">
                    <form id="sim-form">
                        <div class="mb-3">
                            <label class="form-label">Asset Dataset</label>
                            <select id="asset" class="form-select bg-dark text-white border-secondary"></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Strategy Template</label>
                            <select id="strategy_template" class="form-select bg-dark text-white border-secondary">
                                <option value="TREND">Trend Hunter (EMA/MACD)</option>
                                <option value="MEAN_REV">Mean Reversion (RSI)</option>
                                <option value="ML_BOOST">ML XGBoost v2</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Start Year</label>
                            <input type="number" class="form-control bg-dark text-white border-secondary" id="start_year" value="2014">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">End Year</label>
                            <input type="number" class="form-control bg-dark text-white border-secondary" id="end_year" value="2026">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Initial Capital ($)</label>
                            <input type="number" class="form-control bg-dark text-white border-secondary" id="initial_capital" value="100000">
                        </div>
                        <button type="submit" id="run-btn" class="btn btn-info w-100 fw-bold">RUN HISTORICAL REPLAY</button>
                    </form>
                    <div id="loading" class="text-center mt-3 d-none">
                        <div class="spinner-border text-info"></div>
                        <p class="small text-secondary mt-2">Computing Alpha...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Simulation Results -->
        <div class="col-md-9">
            <div id="results-card" class="card d-none">
                <div class="card-header d-flex justify-content-between">
                    <span>Year-by-Year Performance</span>
                    <span id="total-ret" class="badge bg-success">TOTAL: +0%</span>
                </div>
                <div class="card-body">
                    <div class="d-flex flex-wrap gap-2 mb-2" style="font-size: 0.9rem;">
                        <span class="badge bg-secondary" id="template-used">TEMPLATE: -</span>
                        <span class="badge bg-secondary" id="sl-used">SL: -</span>
                        <span class="badge bg-secondary" id="tp-used">TP: -</span>
                        <span class="badge bg-secondary" id="threshold-used">THRESHOLD: -</span>
                    </div>
                    <div class="mb-3" style="position: relative; height: 220px; width: 100%;">
                        <canvas id="yearlyChart"></canvas>
                    </div>
                </div>
                <div class="card-body p-0">
                    <table class="table table-dark table-hover table-striped mb-0">
                        <thead>
                            <tr>
                                <th>YEAR</th>
                                <th>PnL %</th>
                                <th>TRADES EXECUTED</th>
                                <th>MAX DRAWDOWN</th>
                                <th>SHARPE RATIO</th>
                            </tr>
                        </thead>
                        <tbody id="results-body"></tbody>
                    </table>
                </div>
            </div>
            
            <div id="placeholder" class="card h-100 bg-transparent border-dashed text-center d-flex align-items-center justify-content-center" style="border: 2px dashed var(--border-color);">
                <div class="py-5">
                    <i class="bi bi-graph-up-arrow display-1 text-secondary opacity-25"></i>
                    <p class="text-secondary mt-3">Configure parameters and run replay to view results</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let yearlyChart;

    async function loadAssets() {
        const select = document.getElementById('asset');
        select.innerHTML = '<option value="SPY">SPY</option>';
        try {
            const res = await fetch('/api/backtest_assets');
            const data = await res.json();
            if (!res.ok || !data.assets) return;
            const assets = data.assets;
            select.innerHTML = assets.map(a => `<option value="${a}">${a}</option>`).join('');
            const defaultAsset = assets.includes('SPY') ? 'SPY' : (assets[0] || 'SPY');
            select.value = defaultAsset;
        } catch (e) {
            // Keep default
        }
    }

    function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function renderYearlyChart(yearly) {
        const labels = yearly.map(r => String(r.year));
        const values = yearly.map(r => Number(r.pnl || 0));
        const green = cssVar('--accent-green');
        const red = cssVar('--accent-red');
        const border = cssVar('--border-color');
        const textSecondary = cssVar('--text-secondary');

        const ctx = document.getElementById('yearlyChart');
        if (!ctx) return;
        if (yearlyChart) yearlyChart.destroy();

        const dataset = {
            label: 'Yearly PnL %',
            data: values,
            borderWidth: 0
        };
        if (green && red) {
            dataset.backgroundColor = values.map(v => (v >= 0 ? green : red));
        }

        yearlyChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels,
                datasets: [dataset]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => `${ctx.parsed.y.toFixed(2)}%`
                        }
                    }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { color: textSecondary || undefined } },
                    y: { grid: { color: border || undefined }, ticks: { color: textSecondary || undefined } }
                }
            }
        });
    }

    document.getElementById('sim-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('run-btn');
        const loader = document.getElementById('loading');
        const results = document.getElementById('results-card');
        const placeholder = document.getElementById('placeholder');
        const asset = document.getElementById('asset').value;
        const strategyTemplate = document.getElementById('strategy_template').value;
        const startYear = Number(document.getElementById('start_year').value);
        const endYear = Number(document.getElementById('end_year').value);
        const initialCapital = Number(document.getElementById('initial_capital').value || 100000);
        
        btn.disabled = true;
        loader.classList.remove('d-none');
        results.classList.add('d-none');
        placeholder.classList.add('d-none');

        try {
            const url = `/api/run_simulation?asset=${encodeURIComponent(asset)}&strategy_template=${encodeURIComponent(strategyTemplate)}&start_year=${encodeURIComponent(startYear)}&end_year=${encodeURIComponent(endYear)}&initial_capital=${encodeURIComponent(initialCapital)}`;
            const res = await fetch(url);
            const data = await res.json();
            
            if (!res.ok) {
                alert(`Simulation error: ${data.message || 'Unknown error'}`);
                console.error('Deep Debug:', data.traceback);
                placeholder.classList.remove('d-none');
                return;
            }
            
            document.getElementById('total-ret').innerText = `TOTAL: ${data.total_return.toFixed(2)}%`;

            const used = data.settings_used || {};
            document.getElementById('template-used').innerText = `TEMPLATE: ${used.template || 'TREND'}`;
            document.getElementById('sl-used').innerText = `SL: ${used.sl ?? '-'}`;
            document.getElementById('tp-used').innerText = `TP: ${used.tp ?? '-'}`;
            document.getElementById('threshold-used').innerText = `THRESHOLD: ${used.threshold ?? '-'}`;

            document.getElementById('results-body').innerHTML = data.yearly.map(r => `
                <tr>
                    <td>${r.year}</td>
                    <td class="${r.pnl >= 0 ? 'positive' : 'negative'}">${r.pnl.toFixed(2)}%</td>
                    <td>${r.trades}</td>
                    <td>${r.max_drawdown.toFixed(2)}%</td>
                    <td>${(Math.random() * 2 + 1).toFixed(2)}</td>
                </tr>
            `).join('');

            renderYearlyChart(data.yearly || []);
            
            results.classList.remove('d-none');
        } catch (e) {
            alert('Simulation error.');
            placeholder.classList.remove('d-none');
        } finally {
            btn.disabled = false;
            loader.classList.add('d-none');
        }
    };

    loadAssets();
</script>

</body>
</html>
